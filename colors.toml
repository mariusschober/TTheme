# TTheme Dark — TSurfing for Omarchy, after sunset.
# Same grammar as TTheme: the ground turns to night ink, the ink turns to paper,
# and each of the six colors keeps its one meaning, lifted for a dark ground.
#
#   blue    #8297F2  YOU     — human intent, the focused window, the next action
#   magenta #A88BF0  AI      — delegated work, AI's voice, anything a machine is doing
#   green   #6DB894  MET     — done-when lines met, work accepted, progress
#   red     #E5786E  NOT MET — real failures only, never ornament
#   yellow  #D4A35C  GATE    — waiting on your judgment
#   orange  #E2643F  THE DOT — the period in "Tsurfing.": a sentence finished
#
# Everything else is night and paper, so these six can be heard.

mode = "dark"

accent    = "#8297F2"
selection = "#2E3B6A"
muted     = "#6E767C"

background         = "#20272E"
dark_background    = "#1A2026"
darker_background  = "#151A1F"
lighter_background = "#28313A"

foreground        = "#E3DFD3"
dark_foreground   = "#9AA1A6"
light_foreground  = "#CFCBC0"
bright_foreground = "#F3F0E6"

red     = "#E5786E"
yellow  = "#D4A35C"
orange  = "#E2643F"
green   = "#6DB894"
cyan    = "#6AAFBA"
blue    = "#8297F2"
magenta = "#A88BF0"
brown   = "#B98A5E"

bright_red     = "#EE8A63"
bright_yellow  = "#E3B872"
bright_green   = "#84C9A6"
bright_cyan    = "#84C4C9"
bright_blue    = "#9AABF7"
bright_magenta = "#BCA3F5"
